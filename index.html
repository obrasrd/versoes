<!-- ==================== MÓDULO 1 — NÚCLEO ==================== -->
<script>
"use strict";
/* ---------- U: utilitários ---------- */
const U={
  $:id=>document.getElementById(id),
  N:s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim(),
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  q:s=>U.esc(JSON.stringify(String(s??''))),
  NULLS:new Set(['','CADASTRAR','N/A','NA','SEM INFO','-','#N/D','NULL']),
  MES:{JAN:0,FEV:1,MAR:2,ABR:3,MAI:4,JUN:5,JUL:6,AGO:7,SET:8,OUT:9,NOV:10,DEZ:11,FEB:1,APR:3,MAY:4,AUG:7,SEP:8,OCT:9,DEC:11},
  isNull(v){return v==null||U.NULLS.has(U.N(v))},
  num(v){if(U.isNull(v))return null;if(typeof v==='number')return Math.abs(v)<1e-9?0:v;let s=String(v).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?null:(Math.abs(n)<1e-9?0:n)},
  pct(v){if(U.isNull(v))return null;if(typeof v==='number')return +(v<=1.0000001?v*100:v).toFixed(2);return U.num(String(v).replace('%',''))},
  iso:d=>d.toISOString().slice(0,10),
  now:()=>new Date().toISOString(),
  today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},
  pd(v){
    if(U.isNull(v))return'';
    if(v instanceof Date)return isNaN(v)?'':U.iso(v);
    if(typeof v==='number')return(v>20000&&v<80000)?U.iso(new Date(Math.round((v-25569)*864e5))):'';
    const s=String(v).trim();
    if(/^\d{5}(\.\d+)?$/.test(s))return U.pd(+s);
    let m=U.N(s).match(/^([A-Z]{3})[-\/ .]?(\d{2,4})$/);
    if(m&&U.MES[m[1]]!=null){let y=+m[2];if(y<100)y+=2000;return`${y}-${String(U.MES[m[1]]+1).padStart(2,'0')}-01`}
    if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
    m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return'';
  },
  days:(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5),
  fmtD:d=>d?`${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}`:'—',
  fmtDT:t=>t?new Date(t).toLocaleString('pt-BR'):'—',
  fmtR:v=>v==null?'—':'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' Mi',
  fmtN:(v,d=1)=>v==null||isNaN(v)?'—':(+v).toLocaleString('pt-BR',{maximumFractionDigits:d}),
  ufOf:e=>U.N(e).replace(/^EQTL[\s\-_]*/,'').replace(/[^A-Z]/g,'').slice(0,2),
  seName:se=>U.N(se).replace(/^SE\s+/,'').replace(/[´'`’]/g,' ').replace(/\s+/g,' ').trim(),
  slug:se=>U.seName(se).replace(/[^A-Z0-9]/g,'').slice(0,20)||'SE',
  fk(t){const m=U.N(t).match(/([A-Z]?)0*(\d+)$/);return m?m[1]+m[2]:''},
  sem:d=>d==null?'n':d<0?'neg':d<=30?'g':d<=60?'o':'r',
  SEMC:{g:'#0B9454',o:'#E87722',r:'#B92927',neg:'#B92927',n:'#9AA3B2'},
  SEMB:{g:'b-g',o:'b-o',r:'b-r',neg:'b-r',n:'b-x'},
  dBadge(d){return`<span class="badge ${U.SEMB[U.sem(d)]}">${d==null?'—':(d<0?'⚠ ':'')+d+'d'}</span>`},
  stBadge(s){const c={Sugerida:'b-y','Em Ajuste':'b-o',Confirmada:'b-g',Rejeitada:'b-r',Encerrada:'b-x'}[s]||'b-x';return`<span class="badge ${c}">${U.esc(s)}</span>`},
  conf:s=>s>=80?['Alta','b-g']:s>=60?['Média','b-y']:['Baixa','b-r'],
  mode(a){const c={};let b='',n=0;a.forEach(x=>{c[x]=(c[x]||0)+1;if(c[x]>n){n=c[x];b=x}});return b},
  clone:o=>JSON.parse(JSON.stringify(o)),
  tr:(s,n)=>{s=String(s??'');return s.length>n?s.slice(0,n-1)+'…':s},
  dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},
  stampF:()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'),
  debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}},
  has:n=>typeof window[n]!=='undefined'||(()=>{try{return typeof eval(n)!=='undefined'}catch(e){return false}})()
};

/* ---------- Store: LocalStorage por coleção ---------- */
let S={};
const Store={
  P:'eqtl.gi.v2.',
  C:['meta','obrasAT','obrasRD','interfaces','links','deParaSE','auditoria','config','plans','imports'],
  load(){const o={};this.C.forEach(c=>{try{o[c]=JSON.parse(localStorage.getItem(this.P+c))}catch(e){o[c]=null}});return o},
  save(){this.C.forEach(c=>{try{localStorage.setItem(this.P+c,JSON.stringify(S[c]))}catch(e){UI.toast('Falha ao gravar LocalStorage: '+e.message,'r')}})},
  clear(){this.C.forEach(c=>localStorage.removeItem(this.P+c))},
  defConfig:()=>({w:{se:40,mun:20,reg:15,ali:15,kw:10},thr:60,dark:false,filters:{},profile:'Administrador',seq:{}}),
  init(){
    const d=this.load();
    S={meta:d.meta||{},obrasAT:d.obrasAT||{},obrasRD:d.obrasRD||{},interfaces:d.interfaces||{},links:d.links||{},deParaSE:d.deParaSE||{},
       auditoria:d.auditoria||[],config:Object.assign(this.defConfig(),d.config||{}),plans:d.plans||{},imports:d.imports||[]};
    S.config.w=Object.assign(this.defConfig().w,S.config.w||{});
    return Object.keys(S.obrasAT).length+Object.keys(S.obrasRD).length>0;
  }
};

/* ---------- Extração de sigla/alimentador (o Módulo 2 reutiliza) ---------- */
const Ext={
  run(desc){
    const d=U.N(desc),re=/(?:^|[^A-Z0-9])([A-Z]{2,4})-([0-9]{0,2}[A-Z]?[0-9]{1,3})(?![A-Z0-9])/g;let m,sig='',keys=[];
    while((m=re.exec(d))){if(['KV','SE','AL'].includes(m[1]))continue;if(!sig)sig=m[1];if(m[1]===sig){const k=U.fk(m[2]);if(k&&!keys.includes(k))keys.push(k)}re.lastIndex--}
    return{sigla:sig,keys};
  }
};

/* ---------- Parser: normalização das linhas AT/RD ---------- */
const Parser={
  g(r,...names){

    for(const n of names){const k=r.__k[U.N(n).replace(/[^A-Z0-9]/g,'')];if(k!=null&&r[k]!==''&&r[k]!=null)return r[k]}
    return'';
  },
  cnt:()=>({linhas:0,dates:0,nulls:0,consol:0,invalid:0}),
  countDate(c,x){if(x!==''&&x!=null){if(U.pd(x))c.dates++;else c.nulls++}},
  at(rows,c,out={}){
    rows.forEach(r=>{
      c.linhas++;const pep=String(this.g(r,'PEP')).trim();if(!pep||U.isNull(pep)){c.invalid++;return}
      const emp=String(this.g(r,'EMPRESA')).trim(),rR=this.g(r,'DATA DA ENERGIZAÇÃO'),rP=this.g(r,'PROJ DE ENERG');

      const eqs=String(this.g(r,'EQUIPAMENTO')).split(/[,;]+/).map(s=>U.N(s)).filter(s=>s&&!U.isNull(s));
      const mod={cod:String(this.g(r,'CÓDIGO DO MÓDULO')),funcao:String(this.g(r,'FUNÇÃO MÓDULO')),modulo:String(this.g(r,'MÓDULO')),qtd:U.num(this.g(r,'QTDE'))||1,equip:eqs.join(', ')};
      const o=out[pep];

        const d=dR||dP;if(d&&d>o.dEn)o.dEn=d;if(dR)o.tipoData='Real';return}

const App={
  T:[],H:{boot:[],afterLoad:[],render:[],badges:[]},cur:'',dirty:false,
  /* Módulos chamam App.reg('id','Rótulo',{render(){...}}) */
  reg(id,label,obj,order=99){this.T.push({id,label,obj,order});this.T.sort((a,b)=>a.order-b.order)},
  on(h,fn){this.H[h].push(fn)},
  fire(h,...a){this.H[h].forEach(f=>{try{f(...a)}catch(e){console.error(h,e)}})},
  seed(){
    const c=Parser.cnt();S.obrasAT=Parser.at(Seed.atRows(),c);S.obrasRD=Parser.rd(Seed.rdRows(),c);
    S.meta={schema:2,file:'base_teste-interface.xlsx',importedAt:U.now(),user:S.config.profile,stats:c};
    Audit.log('Carga inicial','Base','seed',null,`${Object.keys(S.obrasAT).length} AT / ${Object.keys(S.obrasRD).length} RD`);
  },
  init(){
    const had=Store.init();if(!had)this.seed();
    this.fire('afterLoad',!had);Store.save();
    document.body.classList.toggle('dark',!!S.config.dark);
    const p=U.$('profile');p.innerHTML=Object.keys(Perm.R).map(r=>`<option ${r===S.config.profile?'selected':''}>${r}</option>`).join('');
    p.onchange=()=>{S.config.profile=p.value;Store.save();UI.toast('Perfil: '+p.value,'b');this.render()};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){UI.close();UI.closeDrawer();U.$('gres').style.display='none'}});
    U.$('modal').addEventListener('click',e=>{if(e.target.id==='modal')UI.close()});
    U.$('main').innerHTML=(this.T.length?this.T:[{id:'base'}]).map(t=>`<section class="tab" id="t-${t.id}"></section>`).join('');
    this.fire('boot');
    this.go(this.T[0]?.id||'base');
  },
  nav(){
    const b={};this.fire('badges',b);
    U.$('nav').innerHTML=(this.T.length?this.T:[{id:'base',label:'Base carregada'}]).map(t=>`<button class="${t.id===this.cur?'on':''}" onclick="App.go('${t.id}')">${t.label}${b[t.id]?`<span class="cnt">${b[t.id]}</span>`:''}</button>`).join('');
  },
  go(id){
    const t=this.T.find(x=>x.id===id);
    if(this.dirty&&id!==this.cur){UI.modal({title:'Alterações não salvas',body:'<p>Há edições pendentes nesta aba. Deseja descartá-las?</p>',buttons:[{t:'Continuar editando',c:'gh'},{t:'Descartar',c:'r',fn:()=>{this.dirty=false;this.go(id)}}]});return}
    this.cur=id;document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+id));
    U.$('gres').style.display='none';this.render();window.scrollTo({top:0});
  },
  render(){
    this.stamp();this.fire('render');this.nav();
    const t=this.T.find(x=>x.id===this.cur);
    if(t)t.obj.render();else this.baseSummary();
  },
  stamp(){U.$('stamp').textContent=`Base: ${S.meta.file||'—'} • importada em ${U.fmtDT(S.meta.importedAt)}`},
  /* Tela de verificação do Módulo 1 (some quando o Módulo 2 em diante registram abas) */
  baseSummary(){
    const A=Object.values(S.obrasAT),R=Object.values(S.obrasRD),st=S.meta.stats||{};
    const ufA=[...new Set(A.map(a=>a.uf))].sort(),ufR=[...new Set(R.map(r=>r.uf))].sort();
    U.$('t-base').innerHTML=`<div class="grid g6">
      ${[['Obras AT (PEPs)',A.length,'--azul'],['Obras RD',R.length,'--laranja'],['SEs distintas',new Set(A.map(a=>a.sigla)).size,'--roxo'],
        ['PEPs consolidados',st.consol??'—','--amarelo'],['Datas convertidas',st.dates??'—','--verde'],['Nulos tratados',st.nulls??'—','--vermelho']]
        .map(([l,v,c])=>`<div class="kpi" style="border-top-color:var(${c})"><div class="l">${l}</div><div class="v" style="color:var(${c})">${v}</div></div>`).join('')}</div><br>
      <div class="card"><h3>✅ Módulo 1 (Núcleo) operacional</h3>
        <p>Distribuidoras com AT: <b>${ufA.join(', ')}</b> • Distribuidoras com RD: <b>${ufR.join(', ')}</b></p>
        <p class="mut">Cole o Módulo 2 (Motor e Modelo) para ativar a vinculação, os filtros e a busca global.</p>
        <div class="row"><button class="btn r" onclick="App.reset()">↺ Restaurar base original</button></div></div>
      <div class="grid g2">
        <div class="card"><h3>⚡ Obras AT</h3><div class="tw" style="max-height:420px"><table><thead><tr><th>PEP</th><th>SE</th><th>Sigla</th><th>Equip.</th><th>Energ.</th></tr></thead><tbody>
          ${A.map(a=>`<tr><td>${U.esc(a.pep)}</td><td>${U.esc(a.se)}</td><td>${a.sigla}</td><td>${a.equip.join(', ')||'—'}</td><td>${U.fmtD(a.dEn)} <span class="mut">${a.tipoData}</span></td></tr>`).join('')}</tbody></table></div></div>
        <div class="card"><h3>🛠 Obras RD</h3><div class="tw" style="max-height:420px"><table><thead><tr><th>ID</th><th>Descrição</th><th>Sigla/Alim.</th><th>Energ.</th><th>Custo</th></tr></thead><tbody>
          ${R.map(r=>`<tr><td>${r.id}</td><td>${U.esc(U.tr(r.desc,48))}</td><td>${r.sigla||'—'} ${r.keys.join('/')}</td><td>${U.fmtD(r.dEn)}</td><td>${U.fmtR(r.custo)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  },
  toggleDark(){S.config.dark=!S.config.dark;document.body.classList.toggle('dark',S.config.dark);Store.save();this.render()},
  backup(){U.dl(`eqtl_gi_backup_${U.stampF()}.json`,JSON.stringify(S,null,1),'application/json');Audit.log('Backup','Base','json',null,'exportado');Store.save()},
  reset(){if(!Perm.guard('*'))return;UI.ask('Restaurar base original','Todas as interfaces, vínculos e edições serão apagados. Confirmar?',()=>{const cfg=S.config;Store.clear();Store.init();S.config=cfg;S.config.seq={};this.seed();this.fire('afterLoad',true);Store.save();this.render();UI.toast('Base restaurada')})},
  help(){UI.modal({title:'Ajuda — Governança de Interfaces AT x RD',wide:true,body:`
    <p><b>Regra-mãe:</b> 1 Interface → 1 Obra AT → 1 PEP AT &nbsp;+&nbsp; 1 Interface → N Obras RD → N PEPs RD.</p>
    <p><b>Fluxo:</b> Importação → Motor → Cadastro (sugestão → ajuste → ✅ Interface_ID) → Obras AT/RD → Governança → Dashboard/Gantt → Relatórios.</p>
    <p><b>Delta</b> = Energização RD mais tardia − Energização AT. 🟢 ≤30d • 🟠 31–60d • 🔴 &gt;60d • ⚠ negativo = RD sem fonte.</p>
    <p><b>Interface_ID:</b> INT-{UF}-{SLUGSE}-{SEQ}. É gerado na confirmação, congelado e nunca reaproveitado.</p>
    <p class="mut">Dados salvos no LocalStorage do navegador (prefixo eqtl.gi.v2.). Use 💾 Backup com frequência.</p>`})}
};
window.addEventListener('load',()=>App.init());
</script>

<script>
"use strict";
/* ---------- Motor: correlação AT x RD ... ---------- */
const Motor={
  P:{},nPairs:0,
  STOP:new Set(['NOVA','NOVO','SANTA','SANTO','SERRA','CIDADE','BARRA','ILHA','OLHO','AGUA','POLO','PORTO','DOS','DAS','CENTRAL','FLORES','NORTE','SUL']),
  KW:/ (NOVO|NOVA|NOVOS|ALIMENTADOR|AL|BRT|RECAPACITACAO|MELHORAMENTO|TRIFASEAMENTO|RECONDUTORAMENTO|INTERLIGACAO|CONSTRUCAO|BC|LD) /,
  ext:d=>Ext.run(d),
  alias(){const a={};Object.values(S.deParaSE).forEach(d=>(d.aliases||[]).forEach(x=>{if(x)a[U.N(x)]=d.sigla}));return a},
  score(at,rd,w=S.config.w,al=this.alias()){
    if(!at||!rd||!at.uf||at.uf!==rd.uf)return null;
    const d=' '+U.N(rd.desc).replace(/[^A-Z0-9]+/g,' ')+' ',rs=rd.sigla?(al[rd.sigla]||rd.sigla):'',b={se:0,mun:0,reg:0,ali:0,kw:0,alias:false};
    const name=U.seName(at.se).replace(/[^A-Z0-9]+/g,' ').trim();
    if(at.sigla&&rs===at.sigla){b.se=w.se;b.alias=rs!==rd.sigla}
    else if(name.length>=4&&d.includes(' '+name+' '))b.se=w.se;
    const mun=U.N((S.deParaSE[at.sigla]||{}).municipio||'').replace(/[^A-Z0-9]+/g,' ').split(' ').filter(x=>x.length>=4&&!this.STOP.has(x));
    if(mun.length&&mun.every(x=>d.includes(' '+x+' ')))b.mun=w.mun;
    if(!b.se&&!b.mun)return null;
    b.reg=w.reg;
    if((rd.keys||[]).some(k=>(at.keys||[]).includes(k)))b.ali=w.ali;
    if(this.KW.test(d))b.kw=w.kw;
    b.total=Math.min(100,Math.round(b.se+b.mun+b.reg+b.ali+b.kw));
    return b;
  },
  detTxt:s=>s?`SE ${s.se} • Mun ${s.mun} • Reg ${s.reg} • Alim ${s.ali} • KW ${s.kw}${s.alias?' • via alias':''}`:'sem correlação',
  /* Desempate: maior total → menor distância entre Prev AT (ou Energ. RD) e Energ. AT */
  evaluate(w=S.config.w,store=true){
    const P={},ats=Object.values(S.obrasAT),al=this.alias();let n=0;
    Object.values(S.obrasRD).forEach(rd=>{
      const c=[];
      ats.forEach(at=>{const s=this.score(at,rd,w,al);if(s){n++;const ref=rd.prevAT||rd.dEn;c.push({pep:at.pep,...s,dist:ref&&at.dEn?Math.abs(U.days(ref,at.dEn)):9e9})}});
      if(!c.length)return;
      c.sort((a,b)=>b.total-a.total||a.dist-b.dist);
      const best=c[0],second=c[1]||null;
      P[rd.id]={best,second,amb:!!(best.alias||(second&&best.total-second.total<10))};
    });
    if(store){this.P=P;this.nPairs=n}
    return P;
  },
  locked(pep){const i=S.interfaces[pep];return!!i&&['Confirmada','Rejeitada','Encerrada'].includes(i.status)},
  /* Nunca altera interfaces Confirmadas/Rejeitadas nem vínculos manuais */
  plan(P,thr=S.config.thr){
    const L={};
    Object.entries(S.links).forEach(([rid,l])=>{if(S.obrasRD[rid]&&S.obrasAT[l.pep]&&(l.orig==='manual'||this.locked(l.pep)))L[rid]={...l}});
    Object.keys(S.obrasRD).forEach(rid=>{
      if(L[rid])return;const p=P[rid];
      if(p&&p.best.total>=thr&&!this.locked(p.best.pep)&&S.obrasAT[p.best.pep])L[rid]={pep:p.best.pep,score:p.best.total,orig:'motor'};
    });
    return L;
  },
  /* Simulação: quantos vínculos mudariam com novos pesos/limiar, sem gravar */
  simulate(w,thr){
    const P=this.evaluate(w,false),L=this.plan(P,thr),diff=[];
    new Set([...Object.keys(L),...Object.keys(S.links)]).forEach(r=>{const a=S.links[r]?.pep||'',b=L[r]?.pep||'';if(a!==b)diff.push({rd:r,de:a,para:b})});
    return{P,L,diff};
  },
  ensureDePara(){
    Object.values(S.obrasAT).forEach(a=>{if(a.sigla&&!S.deParaSE[a.sigla])S.deParaSE[a.sigla]={sigla:a.sigla,aliases:Seed.ALIAS[a.sigla]||[],nome:U.seName(a.se),
      municipio:Seed.MUN[a.sigla]||U.seName(a.se).replace(/\s+(II|III|IV|V)$/,''),uf:a.uf}});
  },
  ensureInterfaces(){
    Object.keys(S.obrasAT).forEach(p=>{if(!S.interfaces[p])S.interfaces[p]={pep:p,intId:'',status:'Sugerida',resp:'',obs:'',just:'',score:0,amb:false,regional:'',municipio:'',criado:U.now(),confAt:'',confBy:'',upd:U.now()}});
    Object.keys(S.interfaces).forEach(p=>{if(!S.obrasAT[p]&&S.interfaces[p].status!=='Confirmada')delete S.interfaces[p]});
  },
  refresh(){
    const al=this.alias(),agg={};
    Object.entries(S.links).forEach(([rid,l])=>{
      const s=this.score(S.obrasAT[l.pep],S.obrasRD[rid],S.config.w,al);
      l.score=s?s.total:0;l.det=s;l.amb=!!(this.P[rid]&&this.P[rid].amb&&this.P[rid].best.pep===l.pep);
      (agg[l.pep]=agg[l.pep]||[]).push(l);
    });
    Object.values(S.interfaces).forEach(i=>{const a=agg[i.pep]||[];i.score=a.length?Math.round(a.reduce((t,x)=>t+x.score,0)/a.length):0;i.amb=a.some(x=>x.amb)});
  },
  run(log=false){
    this.ensureDePara();this.evaluate();S.links=this.plan(this.P);this.ensureInterfaces();this.refresh();Model.touch();
    if(log)Audit.log('Executar Motor','Motor','run',null,`${Object.keys(S.links).length} vínculos • ${this.nPairs} pares`);
  },
  /* Vínculo manual (usado pelo Cadastro e Obras RD) */
  link(rid,pep,orig='manual'){const a=S.links[rid]?.pep||'';S.links[rid]={pep,score:0,orig};this.refresh();Model.touch();Audit.log('Vincular RD','Obra RD',rid,a,pep)},
  unlink(rid){const a=S.links[rid]?.pep||'';delete S.links[rid];this.refresh();Model.touch();Audit.log('Desvincular RD','Obra RD',rid,a,'')},
  stats(){
    const L=Object.values(S.links),c=k=>L.filter(l=>U.conf(l.score)[0]===k).length;
    return{pares:this.nPairs,alta:c('Alta'),media:c('Média'),baixa:c('Baixa'),amb:L.filter(l=>l.amb).length,orfas:Object.keys(S.obrasRD).filter(r=>!S.links[r]).length,vinc:L.length};
  }
};

/* ---------- IDGen: Interface_ID definitivo INT-{UF}-{SLUGSE}-{SEQ} ---------- */
const IDGen={
  next(pep){
    const at=S.obrasAT[pep];if(!at)return'';
    const key=`${at.uf}-${U.slug(at.se)}`,used=new Set(Object.values(S.interfaces).map(i=>i.intId).filter(Boolean));
    let n=S.config.seq[key]||0,id;
    do{n++;id=`INT-${key}-${String(n).padStart(4,'0')}`}while(used.has(id));
    S.config.seq[key]=n;return id;
  }
};

/* ---------- Model: visão consolidada por interface ---------- */
const Model={
  ver:0,_c:{},
  touch(){this.ver++},
  idx(){if(this._c.iv!==this.ver){const m={};Object.entries(S.links).forEach(([r,l])=>(m[l.pep]=m[l.pep]||[]).push(r));this._c.idx=m;this._c.iv=this.ver}return this._c.idx},
  rdOf(p){return this.idx()[p]||[]},
  label(i,at){return i.intId||`SUG-${at.uf}-${U.slug(at.se)}-${i.pep.split('.').pop()}`},
  view(pep){
    const i=S.interfaces[pep],at=S.obrasAT[pep];if(!i||!at)return null;
    const rds=this.rdOf(pep).map(r=>S.obrasRD[r]).filter(Boolean).sort((a,b)=>(a.dEn||'9').localeCompare(b.dEn||'9'));
    const dl=rds.map(r=>r.dEn).filter(Boolean).sort(),dRD=dl[dl.length-1]||'',dAT=at.dEn||'',delta=dAT&&dRD?U.days(dRD,dAT):null;
    const dp=S.deParaSE[at.sigla]||{},kr=new Set(rds.flatMap(r=>r.keys||[])),invRD=rds.reduce((t,r)=>t+(r.custo||0),0);
    return{pep,i,at,rds,id:this.label(i,at),se:at.se,sigla:at.sigla,uf:at.uf,distr:'EQTL-'+at.uf,
      regional:i.regional||U.mode(rds.map(r=>r.regional).filter(Boolean))||('EQTL-'+at.uf),municipio:i.municipio||dp.municipio||U.seName(at.se),
      status:i.status,resp:i.resp||'',ano:dAT.slice(0,4),dAT,tipoAT:at.tipoData,dRD,latest:rds.find(r=>r.dEn===dRD)||null,delta,sem:U.sem(delta),
      nPep:rds.reduce((t,r)=>t+r.peps.length,0),semPep:rds.filter(r=>!r.peps.length).length,invAT:at.invPrev,invRD,invRDnull:rds.filter(r=>r.custo==null).length,
      invT:(at.invPrev||0)+invRD,cats:[...new Set(rds.map(r=>r.pi).filter(Boolean))],score:i.score,amb:i.amb,
      idle:(at.keys||[]).filter(k=>!kr.has(k)),semFonte:dAT?rds.filter(r=>r.dEn&&r.dEn<dAT):[],
      desal:dAT?rds.filter(r=>r.prevAT&&Math.abs(U.days(r.prevAT,dAT))>30):[],
      age:Math.max(0,U.days(U.today(),(i.criado||U.now()).slice(0,10)))};
  },
  all(){if(this._c.av!==this.ver){this._c.all=Object.keys(S.interfaces).map(p=>this.view(p)).filter(Boolean);this._c.av=this.ver}return this._c.all},
  filtered(){return this.all().filter(v=>Filters.match(v))},
  byPep(p){return this.all().find(v=>v.pep===p)||this.view(p)},
  orphans(){return Object.values(S.obrasRD).filter(r=>!S.links[r.id])}
};

/* ---------- Filters: filtros globais persistentes ---------- */
const Filters={
  K:[['uf','Distribuidora'],['reg','Regional'],['mun','Município'],['se','Subestação'],['st','Status'],['resp','Responsável'],['ano','Ano Energização'],['cat','Categoria (PI)']],
  get F(){return S.config.filters||(S.config.filters={})},
  match(v){const F=this.F;return(!F.uf||v.distr===F.uf)&&(!F.reg||v.regional===F.reg)&&(!F.mun||v.municipio===F.mun)&&(!F.se||v.se===F.se)&&(!F.st||v.status===F.st)&&(!F.resp||v.resp===F.resp)&&(!F.ano||v.ano===F.ano)&&(!F.cat||v.cats.includes(F.cat))},
  matchAT(a){const v=Model.byPep(a.pep);return v?this.match(v):true},
  matchRD(r){
    const F=this.F;if(F.uf&&'EQTL-'+r.uf!==F.uf)return false;if(F.reg&&r.regional!==F.reg)return false;if(F.cat&&r.pi!==F.cat)return false;
    if(F.mun||F.se||F.st||F.resp||F.ano){const l=S.links[r.id];if(!l)return false;const v=Model.byPep(l.pep);if(!v)return false;
      return(!F.mun||v.municipio===F.mun)&&(!F.se||v.se===F.se)&&(!F.st||v.status===F.st)&&(!F.resp||v.resp===F.resp)&&(!F.ano||v.ano===F.ano)}
    return true;
  },
  opts(k){
    const A=Model.all(),R=Object.values(S.obrasRD),u=a=>[...new Set(a.filter(Boolean))].sort();
    return{uf:u(A.map(v=>v.distr).concat(R.map(r=>'EQTL-'+r.uf))),reg:u(A.map(v=>v.regional).concat(R.map(r=>r.regional))),mun:u(A.map(v=>v.municipio)),se:u(A.map(v=>v.se)),
      st:['Sugerida','Em Ajuste','Confirmada','Rejeitada','Encerrada'],resp:u(A.map(v=>v.resp)),ano:u(A.map(v=>v.ano)),cat:u(R.map(r=>r.pi))}[k];
  },
  set(k,v){this.F[k]=v;Store.save();App.render()},
  clear(){S.config.filters={};Store.save();App.render()},
  render(){
    const F=this.F;
    U.$('fbar').innerHTML=this.K.map(([k,l])=>`<div><label>${l}</label><select onchange="Filters.set('${k}',this.value)"><option value="">Todos</option>${this.opts(k).map(o=>`<option ${F[k]===o?'selected':''}>${U.esc(o)}</option>`).join('')}</select></div>`).join('')
      +`<div><label>&nbsp;</label><button class="btn gh" onclick="Filters.clear()">✕ Limpar</button></div>`;
    U.$('chips').innerHTML=this.K.filter(([k])=>F[k]).map(([k,l])=>`<span class="chip">${l}: ${U.esc(F[k])} <b onclick="Filters.set('${k}','')">×</b></span>`).join('');
  }
};

/* ---------- Nav: roteamento seguro (usa módulos futuros quando existirem) ---------- */
const Nav={
  ex:n=>{try{return typeof eval(n)!=='undefined'}catch(e){return false}},
  openIF(p){U.$('gres').style.display='none';if(this.ex('Cad')&&Cad.open)Cad.open(p);else this.detail(p)},
  openAT(p){U.$('gres').style.display='none';if(this.ex('ATg')&&ATg.find)ATg.find(p);else this.detail(p)},
  openRD(id){U.$('gres').style.display='none';if(this.ex('RDg')&&RDg.find)RDg.find(id);else{const l=S.links[id];l?this.detail(l.pep):this.rdDetail(id)}},
  rdDetail(id){const r=S.obrasRD[id],p=Motor.P[id];if(!r)return;
    UI.modal({title:`Obra RD ${id} — órfã`,body:`<p>${U.esc(r.desc)}</p><p class="mut">Sigla extraída: <b>${r.sigla||'—'}</b> • Alimentadores: ${r.keys.join(', ')||'—'} • Energ.: ${U.fmtD(r.dEn)}</p>
      <p>${p?`Melhor candidata: <b>${U.esc(p.best.pep)}</b> (score ${p.best.total}, abaixo do limiar ${S.config.thr})<br><span class="mut">${Motor.detTxt(p.best)}</span>`:'Nenhuma AT correlacionável na mesma distribuidora.'}</p>`})},
  detail(p){
    const v=Model.byPep(p);if(!v)return;
    UI.modal({title:`${v.id} ${v.i.intId?'':'(sugestão)'}`,wide:true,body:`
      <div class="grid g4">${[['SE',v.se],['PEP AT',v.pep],['Energ. AT',U.fmtD(v.dAT)+' '+v.tipoAT],['Delta',U.dBadge(v.delta)],['Status',U.stBadge(v.status)],['Score médio',v.score+' '+`<span class="badge ${U.conf(v.score)[1]}">${U.conf(v.score)[0]}</span>`],['Regional',v.regional],['Município',v.municipio]]
        .map(([l,x])=>`<div class="mini"><span class="fl">${l}</span>${x}</div>`).join('')}</div><br>
      ${v.amb?'<div class="warn">⚠ Vínculo ambíguo: a diferença entre a 1ª e a 2ª candidata é menor que 10 pontos (ou o vínculo veio por alias).</div>':''}
      ${v.idle.length?`<div class="warn">Bays sem obra RD: <b>${v.idle.join(', ')}</b></div>`:''}

/* ---------- Search: busca global ---------- */

    Object.values(S.obrasRD).forEach(r=>{if(U.N(r.id+' '+r.desc+' '+r.peps.join(' ')).includes(q))res.push(`<div onmousedown="Nav.openRD(${U.q(r.id)})"><b>🛠 RD ${U.esc(r.id)}</b> — ${U.esc(U.tr(r.desc,60))} ${S.links[r.id]?'':'<span class="badge b-r">órfã</span>'}</div>`)});

      ${O.map(r=>{const p=Motor.P[r.id];return`<tr style="cursor:pointer" onclick="Nav.rdDetail(${U.q(r.id)})"><td>${r.id}</td><td>${r.distr}</td><td>${U.esc(U.tr(r.desc,60))}</td><td>${r.sigla||'—'}</td><td>${p?U.esc(p.best.pep)+' ('+p.best.total+')':'—'}</td></tr>`}).join('')||'<tr><td colspan="5" class="mut">Nenhuma</td></tr>'}</tbody></table></div>

<script>
"use strict";
const C3={az:'#065DAC',vd:'#0B9454',am:'#EAA02E',vm:'#B92927',rx:'#32306E'};
const dd3=s=>s?Date.parse(s):NaN, dif3=(a,b)=>Math.round((dd3(a)-dd3(b))/864e5);

/* ---------- Helper: barras horizontais ---------- */
const bars3=L=>{const m=Math.max(1,...L.map(x=>x[1]));return L.map(([l,v,c])=>`<div class="m3bar"><span class="lb" title="${U.esc(l)}">${U.esc(l)}</span><div class="tr"><div class="fi" style="width:${v/m*100}%;background:${c}"></div></div><span class="vl">${v}</span></div>`).join('')||'<p class="mut">Sem dados</p>'};

/* ---------- Dashboard ---------- */
const Dash={
  render(){
    const V=Model.filtered(),O=Model.orphans().filter(r=>Filters.matchRD(r)),cnt=k=>V.filter(v=>v.status===k).length;
    const conf=cnt('Confirmada'),pc=V.length?Math.round(conf/V.length*100):0,nRD=V.reduce((t,v)=>t+v.rds.length,0),
      inv=V.reduce((t,v)=>t+(v.invT||0),0),sf=V.filter(v=>v.semFonte.length).length,amb=V.filter(v=>v.amb).length;
    const K=[['Interfaces',V.length,C3.az],['Confirmadas',`${conf} <small>(${pc}%)</small>`,C3.vd],['Em Ajuste',cnt('Em Ajuste'),C3.am],['Obras RD vinculadas',nRD,C3.az],
      ['RD órfãs',O.length,C3.vm],['Interfaces c/ RD sem fonte',sf,C3.vm],['Ambíguas',amb,C3.am],['Investimento total',U.fmtR(inv),C3.rx]];
    const stC={'Sugerida':C3.az,'Em Ajuste':C3.am,'Confirmada':C3.vd,'Rejeitada':C3.vm,'Encerrada':C3.rx};
    const grp=f=>{const m={};V.forEach(v=>{const k=f(v)||'—';m[k]=(m[k]||0)+1});return m};
    const reg=Object.entries(grp(v=>v.regional)).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,n])=>[k,n,C3.az]);
    const ano=Object.entries(grp(v=>v.ano)).sort().map(([k,n])=>[k,n,C3.rx]);
    const F={'RD antes da AT (sem fonte)':[0,C3.vm],'0 a 30 dias':[0,C3.vd],'31 a 90 dias':[0,C3.am],'> 90 dias (bay ocioso)':[0,C3.vm],'Sem data':[0,'#9aa3af']};
    V.forEach(v=>v.rds.forEach(r=>{const k=!(v.dAT&&r.dEn)?'Sem data':(d=>d<0?'RD antes da AT (sem fonte)':d<=30?'0 a 30 dias':d<=90?'31 a 90 dias':'> 90 dias (bay ocioso)')(dif3(r.dEn,v.dAT));F[k][0]++}));
    const R=V.map(v=>{const x=[];if(v.semFonte.length)x.push(['🔴 RD sem fonte: '+v.semFonte.length,3]);if(v.desal.length)x.push(['🟡 Prev. AT desalinhada: '+v.desal.length,2]);
      if(v.amb)x.push(['🟡 Ambígua',1]);if(v.idle.length)x.push(['🟡 Bays ociosos: '+v.idle.length,1]);if(!v.rds.length)x.push(['⚪ Sem RD',1]);return{v,x,p:x.reduce((t,y)=>t+y[1],0)}})
      .filter(o=>o.p).sort((a,b)=>b.p-a.p).slice(0,15);
    U.$('t-dash').innerHTML=`<div class="grid g4">${K.map(([l,v,c])=>`<div class="kpi" style="border-top-color:${c}"><div class="l">${l}</div><div class="v" style="color:${c}">${v}</div></div>`).join('')}</div><br>
      <div class="grid g2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="card"><h3 style="color:${C3.az}">📌 Interfaces por status</h3>${bars3(Object.keys(stC).map(k=>[k,cnt(k),stC[k]]))}</div>
        <div class="card"><h3 style="color:${C3.az}">⏱ Defasagem RD × AT (por obra RD)</h3>${bars3(Object.entries(F).map(([k,[n,c]])=>[k,n,c]))}</div>
        <div class="card"><h3 style="color:${C3.az}">🗺 Interfaces por regional (top 12)</h3>${bars3(reg)}</div>
        <div class="card"><h3 style="color:${C3.az}">📅 Interfaces por ano de energização AT</h3>${bars3(ano)}</div>
      </div>
      <div class="card"><h3 style="color:${C3.vm}">🚨 Top 15 interfaces em risco</h3><div class="tw"><table><thead><tr><th>Interface</th><th>SE</th><th>Status</th><th>Energ. AT</th><th>Riscos</th></tr></thead><tbody>
      ${R.map(o=>`<tr style="cursor:pointer" onclick="Nav.openIF(${U.q(o.v.pep)})"><td><b>${U.esc(o.v.id)}</b></td><td>${U.esc(o.v.se)}</td><td>${U.stBadge(o.v.status)}</td><td>${U.fmtD(o.v.dAT)}</td><td>${o.x.map(y=>y[0]).join(' • ')}</td></tr>`).join('')||`<tr><td colspan="5" style="color:${C3.vd}">✅ Nenhum risco identificado</td></tr>`}
      </tbody></table></div></div>`;
  }
};

/* ---------- Gantt: AT (◆) × RD (●) na linha do tempo ---------- */
const Gantt={
  sort:'data',only:'',
  render(){
    let V=Model.filtered().filter(v=>v.dAT||v.rds.some(r=>r.dEn));
    if(this.only)V=V.filter(v=>v.semFonte.length||v.desal.length);
    V.sort(this.sort==='risco'?(a,b)=>b.semFonte.length-a.semFonte.length||(a.dAT||'9').localeCompare(b.dAT||'9'):(a,b)=>(a.dAT||'9').localeCompare(b.dAT||'9'));
    const ctl=`<div class="row" style="gap:10px;margin-bottom:10px"><label>Ordenar <select onchange="Gantt.sort=this.value;Gantt.render()"><option value="data" ${this.sort==='data'?'selected':''}>Energização AT</option><option value="risco" ${this.sort==='risco'?'selected':''}>Risco</option></select></label>
      <label><input type="checkbox" ${this.only?'checked':''} onchange="Gantt.only=this.checked?'1':'';Gantt.render()"> Só interfaces em risco</label></div>`;
    if(!V.length){U.$('t-gantt').innerHTML=`<div class="card"><h3>📅 Gantt AT × RD</h3>${ctl}<p class="mut">Nenhuma interface com datas.</p></div>`;return}
    const T=V.flatMap(v=>[v.dAT,...v.rds.map(r=>r.dEn)]).filter(Boolean).map(dd3).concat(Date.now());
    const a0=new Date(Math.min(...T)),b0=new Date(Math.max(...T)),a=new Date(a0.getFullYear(),a0.getMonth()-1,1),b=new Date(b0.getFullYear(),b0.getMonth()+2,1);
    const A=+a,SP=+b-A,x=t=>((t-A)/SP*100).toFixed(2)+'%',M=[];for(const m=new Date(a);m<b;m.setMonth(m.getMonth()+1))M.push(new Date(m));
    const big=M.length>24,head=M.map(m=>`<div class="gx-m" style="left:${x(+m)}">${!big||m.getMonth()%3===0?String(m.getMonth()+1).padStart(2,'0')+'/'+String(m.getFullYear()).slice(2):''}</div>`).join('');
    const grid=M.map(m=>`<div class="gx-m" style="left:${x(+m)}"></div>`).join(''),hj=`<div class="gx-hj" style="left:${x(Date.now())}" title="Hoje"></div>`;
    const rows=V.slice(0,300).map(v=>{
      const ds=[v.dAT,...v.rds.map(r=>r.dEn)].filter(Boolean).map(dd3),lo=Math.min(...ds),hi=Math.max(...ds);
      const rd=v.rds.filter(r=>r.dEn).map(r=>{const bad=v.dAT&&r.dEn<v.dAT;return`<div class="gx-rd" style="left:${x(dd3(r.dEn))};background:${bad?C3.vm:C3.vd}" title="RD ${U.esc(r.id)} • ${U.fmtD(r.dEn)}${bad?' • SEM FONTE':''}"></div>`}).join('');
      return`<div class="gx-r" onclick="Nav.openIF(${U.q(v.pep)})"><div class="gx-l" title="${U.esc(v.se)}">${v.semFonte.length?'🔴':v.desal.length?'🟡':'🟢'} <b>${U.esc(v.id)}</b> <span class="mut">${U.esc(v.se)}</span></div>
        <div class="gx-k">${grid}${hj}<div class="gx-s" style="left:${x(lo)};width:calc(${x(hi)} - ${x(lo)})"></div>${v.dAT?`<div class="gx-at" style="left:${x(dd3(v.dAT))}" title="AT ${U.esc(v.pep)} • ${U.fmtD(v.dAT)} ${v.tipoAT||''}"></div>`:''}${rd}</div></div>`}).join('');
    U.$('t-gantt').innerHTML=`<div class="card"><h3 style="color:${C3.az}">📅 Gantt AT × RD (${V.length} interfaces)</h3>${ctl}
      <div class="gx-lg"><span><b style="color:${C3.az}">◆</b> Energização AT</span><span><b style="color:${C3.vd}">●</b> RD após AT</span><span><b style="color:${C3.vm}">●</b> RD antes da AT (sem fonte)</span><span><b style="color:${C3.am}">│</b> Hoje</span></div>
      <div class="tw" style="max-height:620px"><div class="gx"><div class="gx-h"><div class="gx-l">Interface</div><div class="gx-k">${head}</div></div>${rows}</div></div>
      ${V.length>300?'<p class="mut">Exibindo as 300 primeiras. Use os filtros para refinar.</p>':''}</div>`;
  }
};

/* ---------- Registro das abas (antes do afterLoad: desativa a Prévia) ---------- */
App.reg('dash','📊 Dashboard',Dash,1);
App.reg('gantt','📅 Gantt',Gantt,2);
App.on('badges',b=>{const n=Model.all().filter(v=>v.semFonte.length).length;if(n)b.dash=n});
</script>

<!-- ==================== MÓDULO 4 — CADASTRO E CONFIRMAÇÃO ==================== -->
<style>
.cf-it{border:1px solid #e3e7ee;border-left:5px solid #065DAC;border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fff}
.cf-it h4{margin:0 0 6px;color:#32306E;font-size:14px}
.cf-rd{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dashed #eef1f5}
.cf-bt{border:0;border-radius:5px;padding:5px 10px;color:#fff;cursor:pointer;font-size:12px;margin-right:4px}
.cf-bt.vd{background:#0B9454}.cf-bt.am{background:#EAA02E}.cf-bt.vm{background:#B92927}.cf-bt.az{background:#065DAC}.cf-bt.rx{background:#32306E}
.cf-x{background:none;border:0;color:#B92927;cursor:pointer;font-weight:700}
.cf-it textarea{width:100%;min-height:38px;margin-top:6px;border:1px solid #dde3ea;border-radius:5px;font-size:12px;padding:5px}

<script>
"use strict";
/* ---------- Persistência das decisões (LocalStorage) ---------- */
const Dec={
  K:'eqtl.gi.v2.decisoes',
  all(){try{return JSON.parse(localStorage.getItem(this.K))||{}}catch(e){return{}}},
  get(p){return this.all()[p]||{}},
  set(p,o){const A=this.all();A[p]={...(A[p]||{}),...o,ts:new Date().toISOString(),user:(S.config&&S.config.user)||''};localStorage.setItem(this.K,JSON.stringify(A))},
  apply(v){
    const d=Dec.get(v.pep);if(!d.ts||v._dts===d.ts)return v;
    if(!v._rds0)v._rds0=v.rds.slice();
    const pool=[...v._rds0,...Model.orphans()];
    v.rds=v._rds0.filter(r=>!(d.rem||[]).includes(r.id));
    (d.add||[]).forEach(id=>{const r=pool.find(x=>x.id===id);if(r&&!v.rds.some(x=>x.id===id))v.rds.push(r)});
    v.semFonte=v.rds.filter(r=>v.dAT&&r.dEn&&r.dEn<v.dAT);
    if(d.status)v.status=d.status;v.obs=d.obs||'';v._dts=d.ts;return v;
  }
};
/* Aplica as decisões sobre o modelo existente, sem alterar os Módulos 1 e 2 */
['all','filtered'].forEach(f=>{const o=Model[f].bind(Model);Model[f]=(...a)=>o(...a).map(Dec.apply)});
const _orf4=Model.orphans.bind(Model);
Model.orphans=()=>{const U4=new Set(Object.values(Dec.all()).flatMap(d=>d.add||[]));return _orf4().filter(r=>!U4.has(r.id))};
const rr4=()=>{try{(App.render||App.refresh).call(App)}catch(e){Conf.render()}};

/* ---------- Aba Confirmação ---------- */
const Conf={
  st:'pend',q:'',
  act(p,s){const o=document.getElementById('obs-'+p);Dec.set(p,{status:s,obs:o?o.value:''});rr4()},
  rem(p,id){const d=Dec.get(p);Dec.set(p,{rem:[...new Set([...(d.rem||[]),id])],add:(d.add||[]).filter(x=>x!==id),status:'Em Ajuste'});rr4()},
  add(p){const s=document.getElementById('add-'+p);if(!s||!s.value)return;const d=Dec.get(p);
    Dec.set(p,{add:[...new Set([...(d.add||[]),s.value])],rem:(d.rem||[]).filter(x=>x!==s.value),status:'Em Ajuste'});rr4()},
  reset(p){if(!confirm('Desfazer todas as decisões desta interface?'))return;const A=Dec.all();delete A[p];localStorage.setItem(Dec.K,JSON.stringify(A));location.reload()},
  csv(){
    const L=[['PEP_AT','Interface','SE','Status','RDs vinculadas','Observação','Usuário','Data decisão']];
    Model.all().forEach(v=>{const d=Dec.get(v.pep);L.push([v.pep,v.id,v.se,v.status,v.rds.map(r=>r.id).join(' | '),d.obs||'',d.user||'',d.ts||''])});
    const b=new Blob(['\ufeff'+L.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='decisoes_AT_RD_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  },
  render(){
    let V=Model.filtered();
    if(this.st==='pend')V=V.filter(v=>['Sugerida','Em Ajuste'].includes(v.status));
    else if(this.st)V=V.filter(v=>v.status===this.st);
    if(this.q){const q=U.N(this.q);V=V.filter(v=>U.N(v.id+' '+v.se+' '+v.pep).includes(q))}
    const O=Model.orphans(),opt=O.slice(0,500).map(r=>`<option value="${U.esc(r.id)}">${U.esc(r.id)} — ${U.esc((r.desc||'').slice(0,60))}</option>`).join('');
    const tot=Model.all(),c=s=>tot.filter(v=>v.status===s).length,pc=tot.length?Math.round(c('Confirmada')/tot.length*100):0;
    const bc={'Confirmada':'#0B9454','Em Ajuste':'#EAA02E','Rejeitada':'#B92927','Encerrada':'#32306E'};
    U.$('t-conf').innerHTML=`<div class="card"><h3 style="color:#065DAC">✅ Cadastro e Confirmação de Vínculos</h3>
      <div style="background:#eef1f5;border-radius:6px;height:14px;overflow:hidden;margin:6px 0"><div style="width:${pc}%;height:100%;background:#0B9454"></div></div>
      <p class="mut">Progresso: <b style="color:#0B9454">${c('Confirmada')} confirmadas (${pc}%)</b> • <b style="color:#EAA02E">${c('Em Ajuste')} em ajuste</b> • ${c('Sugerida')} sugeridas • <b style="color:#B92927">${c('Rejeitada')} rejeitadas</b></p>
      <div class="row" style="gap:10px;margin:8px 0">
        <select onchange="Conf.st=this.value;Conf.render()">${[['pend','⏳ Pendentes'],['','Todas'],['Confirmada','Confirmadas'],['Rejeitada','Rejeitadas'],['Encerrada','Encerradas']].map(([k,l])=>`<option value="${k}" ${this.st===k?'selected':''}>${l}</option>`).join('')}</select>
        <input placeholder="🔎 Interface, SE ou PEP" value="${U.esc(this.q)}" onchange="Conf.q=this.value;Conf.render()">
        <button class="cf-bt rx" onclick="Conf.csv()">⬇ Exportar decisões (CSV)</button></div></div>
      ${V.slice(0,100).map(v=>{const P=U.esc(v.pep),q=U.q(v.pep);return`<div class="cf-it" style="border-left-color:${bc[v.status]||'#065DAC'}">
        <h4>${U.esc(v.id)} <span class="mut">• ${U.esc(v.se)} • AT ${P} • ${U.fmtD(v.dAT)}</span> ${U.stBadge(v.status)}</h4>
        ${v.rds.map(r=>{const bad=v.dAT&&r.dEn&&r.dEn<v.dAT;return`<div class="cf-rd">${bad?'🔴':'🟢'} <b>${U.esc(r.id)}</b><span class="mut" style="flex:1">${U.esc((r.desc||'').slice(0,80))} • ${U.fmtD(r.dEn)}${r.score!=null?' • score '+r.score:''}</span><button class="cf-x" title="Desvincular" onclick="Conf.rem(${q},${U.q(r.id)})">✖</button></div>`}).join('')||'<p class="mut">⚪ Nenhuma RD vinculada</p>'}
        <div class="row" style="gap:6px;margin-top:6px"><select id="add-${P}" style="flex:1"><option value="">➕ Vincular RD órfã…</option>${opt}</select><button class="cf-bt az" onclick="Conf.add(${q})">Vincular</button></div>
        <textarea id="obs-${P}" placeholder="Observação / justificativa">${U.esc(v.obs||'')}</textarea>
        <div style="margin-top:6px"><button class="cf-bt vd" onclick="Conf.act(${q},'Confirmada')">✔ Confirmar</button><button class="cf-bt am" onclick="Conf.act(${q},'Em Ajuste')">✎ Em ajuste</button><button class="cf-bt vm" onclick="Conf.act(${q},'Rejeitada')">✖ Rejeitar</button><button class="cf-bt rx" onclick="Conf.act(${q},'Encerrada')">■ Encerrar</button>
        <button class="cf-x" style="float:right" onclick="Conf.reset(${q})">↺ desfazer</button></div></div>`}).join('')||'<div class="card"><p style="color:#0B9454">✅ Nada pendente neste filtro. Pode ir tomar um café! ☕</p></div>'}
      ${V.length>100?'<p class="mut">Exibindo 100. Refine pelos filtros.</p>':''}`;
  }
};
App.reg('conf','✅ Confirmação',Conf,3);
App.on('badges',b=>{const n=Model.all().filter(v=>['Sugerida','Em Ajuste'].includes(v.status)).length;if(n)b.conf=n});
</script>

<!-- ==================== MÓDULO 5 — DIAGNÓSTICO FCS ==================== -->
<style>
.fcs-it{border:1px solid #e3e7ee;border-left:6px solid #065DAC;border-radius:8px;background:#fff;padding:12px 14px;margin-bottom:12px}
.fcs-it h4{margin:0 0 8px;font-size:15px}
.fcs-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:12.5px}
.fcs-g div{background:#f6f8fb;border-radius:6px;padding:8px}
.fcs-g b{display:block;color:#32306E;margin-bottom:3px}
.fcs-top{font-size:12px;margin-top:8px;color:#32306E}
.fcs-top a{color:#065DAC;cursor:pointer;text-decoration:underline;margin-right:8px}
.fcs-hd{background:#065DAC;color:#fff;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.fcs-hd h2{margin:0;font-size:18px}
@media print{
  body *{visibility:hidden}
  #t-fcs,#t-fcs *{visibility:visible}
  #t-fcs{position:absolute;left:0;top:0;width:100%}
  .noprt{display:none!important}
  .fcs-it{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<script>
"use strict";
const FCS={
  build(){
    const V=Model.filtered(),O=Model.orphans().filter(r=>Filters.matchRD(r)),pend=V.filter(v=>['Sugerida','Em Ajuste'].includes(v.status));
    const sf=V.filter(v=>v.semFonte.length),nSf=sf.reduce((t,v)=>t+v.semFonte.length,0),
      idl=V.filter(v=>v.idle&&v.idle.length),nId=idl.reduce((t,v)=>t+v.idle.length,0),
      des=V.filter(v=>v.desal&&v.desal.length),amb=V.filter(v=>v.amb),sem=V.filter(v=>!v.rds.length);
    const I=[];
    if(nSf)I.push({c:'#B92927',s:'🔴 Crítico',t:'Obras RD energizando sem fonte',
      f:`${nSf} obra(s) RD em ${sf.length} interface(s) com energização prevista ANTES da AT.`,
      ca:'Cronogramas de AT e RD planejados de forma independente. A AT atrasou ou a RD foi antecipada.',
      so:'Replanejar a RD para depois da AT ou priorizar a AT. Formalizar a data no comitê de interfaces.',L:sf});
    if(des.length)I.push({c:'#EAA02E',s:'🟡 Atenção',t:'Previsão de AT desalinhada',
      f:`${des.length} interface(s) com divergência entre a data da AT e a data considerada pela RD.`,
      ca:'Base de RD desatualizada em relação ao último replanejamento da AT.',
      so:'Sincronizar as datas entre as áreas (rotina mensal) e atualizar o cronograma RD no sistema.',L:des});
    if(nId)I.push({c:'#EAA02E',s:'🟡 Atenção',t:'Bays ociosos (> 90 dias)',
      f:`${nId} saída(s) com RD energizando mais de 90 dias depois da AT, em ${idl.length} interface(s).`,
      ca:'Obras RD sem projeto ou sem verba no ritmo da AT.',
      so:'Antecipar as RDs prioritárias ou rever o escopo de bays da AT. Capital parado também custa. 💸',L:idl});
    if(O.length)I.push({c:'#B92927',s:'🔴 Não conformidade',t:'Obras RD órfãs',
      f:`${O.length} obra(s) RD sem vínculo com nenhuma AT.`,
      ca:'Descrição da obra fora do padrão ou SE/alimentador não identificado no De-Para.',
      so:'Vincular as obras na aba Confirmação e completar os aliases do De-Para.',L:[]});
    if(amb.length)I.push({c:'#EAA02E',s:'🟡 Atenção',t:'Vínculos ambíguos',
      f:`${amb.length} interface(s) com mais de uma AT possível.`,
      ca:'A mesma SE tem várias ATs no mesmo período.',
      so:'Validar com o planejamento da expansão e confirmar o vínculo manualmente.',L:amb});
    if(pend.length)I.push({c:'#065DAC',s:'🔵 Gestão',t:'Vínculos pendentes de confirmação',
      f:`${pend.length} de ${V.length} interface(s) ainda sem decisão (${V.length?Math.round(pend.length/V.length*100):0}%).`,
      ca:'A análise foi gerada automaticamente e ainda não foi validada pela área.',
      so:'Definir um ponto focal por regional e um prazo para confirmar os vínculos.',L:pend});
    if(sem.length)I.push({c:'#9aa3af',s:'⚪ Informativo',t:'ATs sem obra RD associada',
      f:`${sem.length} interface(s) AT sem nenhuma RD vinculada.`,
      ca:'AT de reforço ou RD ainda não cadastrada.',
      so:'Confirmar se a AT precisa de saídas novas. Se precisar, abrir as obras RD.',L:sem});
    return{V,I};
  },
  txt(){
    const{V,I}=this.build();
    return`DIAGNÓSTICO AT x RD (FCS): ${new Date().toLocaleDateString('pt-BR')}\nInterfaces analisadas: ${V.length}\n\n`+
      I.map((x,i)=>`${i+1}. [${x.s.replace(/^\S+\s/,'')}] ${x.t}\n   FATO: ${x.f}\n   CAUSA: ${x.ca}\n   SOLUÇÃO: ${x.so}`).join('\n\n');
  },
  copy(){navigator.clipboard.writeText(this.txt()).then(()=>alert('📋 Diagnóstico copiado! Agora é só colar no e-mail.'))},
  render(){
    const{V,I}=this.build(),crit=I.filter(x=>x.c==='#B92927').length;
    const sit=crit?`<b style="color:#fff;background:#B92927;padding:2px 8px;border-radius:4px">${crit} ponto(s) crítico(s)</b>`:`<b style="color:#fff;background:#0B9454;padding:2px 8px;border-radius:4px">✅ Sem pontos críticos</b>`;
    U.$('t-fcs').innerHTML=`<div class="fcs-hd"><h2>📑 Diagnóstico AT × RD (Fato • Causa • Solução)</h2>
      <div style="font-size:12px;margin-top:4px">Equatorial Energia • ${new Date().toLocaleString('pt-BR')} • ${V.length} interfaces analisadas (filtros aplicados) • ${sit}</div></div>
      <div class="noprt" style="margin-bottom:12px"><button class="cf-bt az" onclick="window.print()">🖨 Imprimir / PDF</button><button class="cf-bt rx" onclick="FCS.copy()">📋 Copiar texto</button></div>
      ${I.map((x,i)=>`<div class="fcs-it" style="border-left-color:${x.c}"><h4 style="color:${x.c}">${i+1}. ${x.t} <small style="color:#32306E">• ${x.s}</small></h4>
        <div class="fcs-g"><div><b>📌 Fato</b>${U.esc(x.f)}</div><div><b>🔍 Causa</b>${U.esc(x.ca)}</div><div><b>🛠 Solução</b>${U.esc(x.so)}</div></div>
        ${x.L.length?`<div class="fcs-top"><b>Principais:</b> ${x.L.slice(0,8).map(v=>`<a onclick="Nav.openIF(${U.q(v.pep)})">${U.esc(v.id)}</a>`).join('')}${x.L.length>8?` <span class="mut">+${x.L.length-8}</span>`:''}</div>`:''}</div>`).join('')
      ||'<div class="card"><p style="color:#0B9454">✅ Nenhuma inconsistência encontrada. Rara como poste sem gambiarra. 😄</p></div>'}`;
  }
};
App.reg('fcs','📑 Diagnóstico FCS',FCS,4);
App.on('badges',b=>{const n=Model.all().filter(v=>v.semFonte.length).length+Model.orphans().length;if(n)b.fcs=n});
</script>

<!-- ==================== MÓDULO 6 — EXPORTAÇÃO E BACKUP ==================== -->
<style>
.ex-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ex-c{background:#fff;border:1px solid #e3e7ee;border-top:4px solid #065DAC;border-radius:8px;padding:14px}
.ex-c h4{margin:0 0 6px;color:#32306E}
.ex-c p{font-size:12px;color:#5b6170;min-height:34px}
</style>
<script>
"use strict";
const Exp={
  dif:(a,b)=>a&&b?Math.round((Date.parse(a)-Date.parse(b))/864e5):'',
  hoje:()=>new Date().toISOString().slice(0,10),
  dl(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
  /* Gera .xls (tabela HTML) com cabeçalho colorido, que abre direto no Excel */
  xls(nome,H,L,cor){
    const e=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const th=H.map(h=>`<th style="background:#065DAC;color:#fff;border:1px solid #ccc">${e(h)}</th>`).join('');
    const tr=L.map((r,i)=>`<tr>${r.map((c,j)=>`<td style="border:1px solid #ddd;${cor&&cor(r,j)||''}${i%2?'background:#f6f8fb':''}">${e(c)}</td>`).join('')}</tr>`).join('');
    this.dl(new Blob(['\ufeff<html><head><meta charset="utf-8"></head><body><table>'+`<tr>${th}</tr>`+tr+'</table></body></html>'],{type:'application/vnd.ms-excel'}),nome+'_'+this.hoje()+'.xls');
  },
  interfaces(){
    const stc={'Confirmada':'#0B9454','Em Ajuste':'#EAA02E','Rejeitada':'#B92927','Encerrada':'#32306E'};
    const L=Model.filtered().map(v=>[v.pep,v.id,v.se,v.regional||'',v.ano||'',v.status,U.fmtD(v.dAT),v.tipoAT||'',v.rds.length,v.semFonte.length,(v.desal||[]).length,(v.idle||[]).length,v.amb?'Sim':'Não',v.invT||0,v.obs||'']);
    this.xls('interfaces_AT_RD',['PEP AT','Interface','SE','Regional','Ano','Status','Energ. AT','Tipo AT','Qtd RD','RD sem fonte','Desalinhadas','Bays ociosos','Ambígua','Investimento (R$)','Observação'],L,
      (r,j)=>j===5&&stc[r[5]]?`color:${stc[r[5]]};font-weight:bold;`:j===9&&r[9]>0?'color:#B92927;font-weight:bold;':'');
  },
  rds(){
    const sit=d=>d===''?'Sem data':d<0?'Sem fonte':d<=30?'OK (0-30d)':d<=90?'Atenção (31-90d)':'Bay ocioso (>90d)';
    const L=[];
    Model.filtered().forEach(v=>v.rds.forEach(r=>{const d=this.dif(r.dEn,v.dAT);L.push([r.id,r.desc||'',v.pep,v.id,v.se,v.status,U.fmtD(v.dAT),U.fmtD(r.dEn),d,sit(d),r.score??''])}));
    Model.orphans().filter(r=>Filters.matchRD(r)).forEach(r=>L.push([r.id,r.desc||'','','','','ÓRFÃ','',U.fmtD(r.dEn),'','Sem vínculo','']));
    const cs={'Sem fonte':'#B92927','Sem vínculo':'#B92927','Bay ocioso (>90d)':'#B92927','Atenção (31-90d)':'#EAA02E','OK (0-30d)':'#0B9454'};
    this.xls('obras_RD',['Obra RD','Descrição','PEP AT','Interface','SE','Status','Energ. AT','Energ. RD','Defasagem (dias)','Situação','Score'],L,
      (r,j)=>j===9&&cs[r[9]]?`color:${cs[r[9]]};font-weight:bold;`:'');
  },
  backup(){
    const D=Dec.all(),n=Object.keys(D).length;
    if(!n)return alert('⚪ Ainda não há decisões para salvar.');
    this.dl(new Blob([JSON.stringify({app:'eqtl.gi.v2',ts:new Date().toISOString(),n,dec:D},null,1)],{type:'application/json'}),'backup_decisoes_'+this.hoje()+'.json');
    localStorage.setItem('eqtl.gi.v2.lastbk',new Date().toISOString());this.render();
  },
  restore(inp){
    const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{
      const j=JSON.parse(rd.result);if(j.app!=='eqtl.gi.v2'||!j.dec)throw 0;
      const sub=confirm(`Backup de ${new Date(j.ts).toLocaleString('pt-BR')} com ${j.n} decisões.\n\nOK = SUBSTITUIR tudo\nCancelar = MESCLAR (vale a decisão mais recente)`);
      const A=sub?{}:Dec.all();
      Object.entries(j.dec).forEach(([p,d])=>{if(!A[p]||(d.ts||'')>(A[p].ts||''))A[p]=d});
      localStorage.setItem(Dec.K,JSON.stringify(A));alert('✅ Backup restaurado!');location.reload();
    }catch(e){alert('🔴 Arquivo inválido. Use um backup gerado por esta ferramenta.')}};
    rd.readAsText(f);
  },
  limpar(){
    if(!confirm('🔴 Apagar TODAS as decisões deste navegador?'))return;
    if(prompt('Digite APAGAR para confirmar:')!=='APAGAR')return alert('Ufa! Nada foi apagado. 😅');
    localStorage.removeItem(Dec.K);location.reload();
  },
  render(){
    const n=Object.keys(Dec.all()).length,lb=localStorage.getItem('eqtl.gi.v2.lastbk'),
      dias=lb?Math.floor((Date.now()-Date.parse(lb))/864e5):null,
      [cor,msg]=!n?['#9aa3af','⚪ Nenhuma decisão registrada ainda']:dias===null?['#B92927','🔴 Nenhum backup feito até agora!']:dias>7?['#EAA02E',`🟡 Último backup foi há ${dias} dias`]:['#0B9454',`✅ Backup em dia (${new Date(lb).toLocaleString('pt-BR')})`];
    U.$('t-exp').innerHTML=`<div class="card"><h3 style="color:#065DAC">💾 Exportação e Backup</h3>
      <p style="border-left:5px solid ${cor};padding:6px 10px;background:#f6f8fb;color:${cor};font-weight:600">${msg} • ${n} decisão(ões) gravada(s) no navegador</p></div>
      <div class="ex-g">
        <div class="ex-c"><h4>📊 Excel: Interfaces</h4><p>Uma linha por interface, com status e riscos (respeita os filtros).</p><button class="cf-bt az" onclick="Exp.interfaces()">⬇ Baixar .xls</button></div>
        <div class="ex-c"><h4>🔌 Excel: Obras RD</h4><p>Uma linha por RD, com defasagem e situação, incluindo as órfãs.</p><button class="cf-bt az" onclick="Exp.rds()">⬇ Baixar .xls</button></div>
        <div class="ex-c" style="border-top-color:#0B9454"><h4>💾 Backup das decisões</h4><p>Salva as decisões num arquivo .json. Recomendo fazer toda semana.</p><button class="cf-bt vd" onclick="Exp.backup()">💾 Salvar backup</button></div>
        <div class="ex-c" style="border-top-color:#EAA02E"><h4>♻ Restaurar backup</h4><p>Carrega um .json: substitui tudo ou mescla com o que já existe.</p><label class="cf-bt am" style="display:inline-block">📂 Escolher arquivo<input type="file" accept=".json" hidden onchange="Exp.restore(this)"></label></div>
        <div class="ex-c" style="border-top-color:#B92927"><h4>🗑 Zona de perigo</h4><p>Apaga todas as decisões deste navegador. Não tem como desfazer.</p><button class="cf-bt vm" onclick="Exp.limpar()">🗑 Limpar decisões</button></div>
      </div>`;
  }
};
App.reg('exp','💾 Exportar/Backup',Exp,5);
App.on('badges',b=>{const n=Object.keys(Dec.all()).length,lb=localStorage.getItem('eqtl.gi.v2.lastbk');if(n&&(!lb||Date.now()-Date.parse(lb)>7*864e5))b.exp='!'});
</script>

<!-- ==================== MÓDULO 7 — PAINEL EXECUTIVO E AJUDA ==================== -->
<style>
.px-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.px-k div{background:#fff;border:1px solid #e3e7ee;border-top:4px solid #065DAC;border-radius:8px;padding:10px;text-align:center}
.px-k b{display:block;font-size:24px;color:#32306E}
.px-k span{font-size:11px;color:#5b6170}
.px-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.px-bar{display:flex;align-items:center;gap:6px;font-size:12px;margin:4px 0}
.px-bar i{display:block;height:14px;border-radius:3px}
.px-nota{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;margin:auto}
@media(max-width:800px){.px-g{grid-template-columns:1fr}}
</style>
<script>
"use strict";
const Exe={
  risco:v=>v.semFonte.length*5+(v.idle||[]).length*2+(v.desal||[]).length*2+(v.amb?1:0),
  render(){
    const V=Model.filtered(),O=Model.orphans().filter(r=>Filters.matchRD(r)),n=V.length||1,
      rk=V.filter(v=>this.risco(v)>0),conf=V.filter(v=>v.status==='Confirmada').length,
      nRD=V.reduce((t,v)=>t+v.rds.length,0),nSf=V.reduce((t,v)=>t+v.semFonte.length,0),
      inv=V.reduce((t,v)=>t+(+v.invT||0),0);
    /* Nota: 100 - penalidades (risco, órfãs, pendências) */
    const nota=Math.max(0,Math.round(100-rk.length/n*50-Math.min(O.length/((nRD+O.length)||1),1)*25-(1-conf/n)*25)),
      cN=nota>=80?'#0B9454':nota>=60?'#EAA02E':'#B92927',
      lN=nota>=80?'✅ Carteira saudável':nota>=60?'🟡 Requer atenção':'🔴 Situação crítica';
    /* Por regional */
    const R={};V.forEach(v=>{const k=v.regional||'N/D';R[k]=R[k]||{ok:0,rk:0};this.risco(v)?R[k].rk++:R[k].ok++});
    const mx=Math.max(1,...Object.values(R).map(x=>x.ok+x.rk));
    const bReg=Object.entries(R).sort((a,b)=>b[1].rk-a[1].rk).map(([k,x])=>`<div class="px-bar"><span style="width:90px">${U.esc(k)}</span>
      <i style="width:${x.ok/mx*65}%;background:#0B9454" title="${x.ok} OK"></i><i style="width:${x.rk/mx*65}%;background:#B92927" title="${x.rk} com risco"></i><span class="mut">${x.ok}/${x.rk}</span></div>`).join('');
    /* Próximos 12 meses */
    const M=[],h=new Date();for(let i=0;i<12;i++){const d=new Date(h.getFullYear(),h.getMonth()+i,1);M.push({k:d.toISOString().slice(0,7),l:d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}),at:0,rd:0})}
    const mk=s=>s?String(s).slice(0,7):'';
    V.forEach(v=>{const a=M.find(m=>m.k===mk(v.dAT));if(a)a.at++;v.rds.forEach(r=>{const b=M.find(m=>m.k===mk(r.dEn));if(b)b.rd++})});
    const mm=Math.max(1,...M.map(m=>Math.max(m.at,m.rd)));
    const bMes=M.map(m=>`<div class="px-bar"><span style="width:60px">${m.l}</span><i style="width:${m.at/mm*40}%;background:#065DAC"></i><i style="width:${m.rd/mm*40}%;background:#EAA02E"></i><span class="mut">${m.at} AT • ${m.rd} RD</span></div>`).join('');
    const top=[...V].sort((a,b)=>this.risco(b)-this.risco(a)).filter(v=>this.risco(v)).slice(0,5);
    const K=(t,v,c)=>`<div style="border-top-color:${c}"><b style="color:${c}">${v}</b><span>${t}</span></div>`;
    U.$('t-exe').innerHTML=`<div class="fcs-hd"><h2>🏆 Painel Executivo: Interfaces AT × RD</h2><div style="font-size:12px">Equatorial Energia • ${new Date().toLocaleString('pt-BR')}</div></div>
      <div class="px-g" style="margin-bottom:12px">
        <div class="card" style="text-align:center"><h3 style="color:#065DAC">Saúde da carteira</h3><div class="px-nota" style="background:${cN}">${nota}</div><p style="color:${cN};font-weight:700">${lN}</p></div>
        <div class="card"><h3 style="color:#B92927">🔥 Top 5 críticas</h3>${top.map((v,i)=>`<div class="px-bar"><b>${i+1}.</b><a style="color:#065DAC;cursor:pointer;flex:1" onclick="Nav.openIF(${U.q(v.pep)})">${U.esc(v.id)}</a><span class="mut">${v.semFonte.length} sem fonte • risco ${this.risco(v)}</span></div>`).join('')||'<p style="color:#0B9454">✅ Nenhuma interface crítica. Pode pedir aumento! 😄</p>'}</div></div>
      <div class="px-k">${K('Interfaces',V.length,'#065DAC')}${K('Obras RD vinculadas',nRD,'#065DAC')}${K('Confirmadas',Math.round(conf/n*100)+'%','#0B9454')}${K('Com risco',rk.length,'#EAA02E')}${K('RD sem fonte',nSf,'#B92927')}${K('RD órfãs',O.length,'#B92927')}${K('Investimento',inv?'R$ '+(inv/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':'—','#32306E')}</div>
      <div class="px-g">
        <div class="card"><h3 style="color:#065DAC">📍 Por regional <small class="mut">(🟢 OK • 🔴 risco)</small></h3>${bReg||'<p class="mut">Sem dados</p>'}</div>
        <div class="card"><h3 style="color:#065DAC">📅 Próximos 12 meses <small class="mut">(🔵 AT • 🟡 RD)</small></h3>${bMes}</div></div>
      <div class="card noprt" style="margin-top:12px"><h3 style="color:#32306E">❓ Ajuda rápida</h3>
        <p class="mut">⌨ <b>1–7</b> trocar de aba • <b>Ctrl+P</b> imprimir • <b>Ctrl+F5</b> recarregar<br>
        🔄 Fluxo: <b>Carregar bases → Dashboard → Confirmação → Diagnóstico FCS → Exportar/Backup</b><br>
        💾 As decisões ficam no navegador. Faça backup toda semana.</p>
        <button class="cf-bt az" onclick="window.print()">🖨 Imprimir painel</button></div>`;
  }
};
